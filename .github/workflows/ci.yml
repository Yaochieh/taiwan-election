name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install fastapi==0.135.2 uvicorn==0.42.0 pydantic==2.12.5 \
            pandas==2.3.3 httpx==0.28.1 pytest
      - name: 資料真實性稽核
        run: python scripts/audit_authenticity.py
      - name: Tests
        run: python -m pytest tests/ -q
